schema_version: 1
workspace_root: ../..

# Mario Kart Wii NTSC-K (RMCK01). The same translation surface as projects/mkwii/recomp.yml, with
# the facts that differ per region: the small-data bases the DOL's __init_registers installs, the
# StaticR.rel load address, the clean-input digests, and the guest address table the runtime's
# PAL-spelled addresses resolve through. The function map is the PAL map ported through the
# community region table and validated against these binaries by tools/region/port_map.py;
# MAP_REPORT.md next to it carries the numbers.
project:
  id: mkwii-rmck01
  display_name: Mario Kart Wii NTSC-K
  game_id: RMCK01
  region: K
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x8037AC00
  sda2_base: 0x8037CFC0

inputs:
  dol:
    path: Assets/main.dol
    sha256: 3098a1e9259b4915e32a4ccb5a1f124823f2a0914db29cd2476e10bdb01a77da

  rel:
    path: Assets/StaticR.rel
    load_address: 0x804FE300
    sha256: f441b08e4ccc2d64aadcac8429973f10ea6b1cc8f175500fc084983775f7b3e5

translation:
  entry_points:
    - 0x800060A4
  function_map:
    path: projects/mkwii-ntsc-k/MAP.txt
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx
  guest_address_table: runtime/include/region/rmck01.h

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/mkwii_base_manifest.json
