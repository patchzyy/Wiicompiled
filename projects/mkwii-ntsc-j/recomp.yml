schema_version: 1
workspace_root: ../..

# Mario Kart Wii NTSC-J (RMCJ01). The same translation surface as projects/mkwii/recomp.yml, with
# the facts that differ per region: the small-data bases the DOL's __init_registers installs, the
# StaticR.rel load address and the clean-input digests. The function map is the PAL map ported
# through the community region table and validated against these binaries.
project:
  id: mkwii-rmcj01
  display_name: Mario Kart Wii NTSC-J
  game_id: RMCJ01
  region: J
  base_manifest_format: mkwii-recomp-base-manifest
  base_manifest_stem: mkwii_base

memory:
  base: 0x80000000
  size: 0x01A00000
  sda_base: 0x8038C580
  sda2_base: 0x8038E920

inputs:
  dol:
    path: Assets/main.dol
    sha256: 1b9621ef7c5d97dada103e50e5389730e67f3c2545dda592edd4b5843655af91

  rel:
    path: Assets/StaticR.rel
    load_address: 0x8050FC60
    sha256: 88539012d357a1420724e51dc7e351192ce696da4b0045994895518a3fad6fae

translation:
  entry_points:
    - 0x800060A4
  function_map:
    path: projects/mkwii-ntsc-j/MAP.txt
  allow_unsupported_instructions: false

runtime:
  native_registration_root: runtime/src
  native_abi_directories:
    - runtime/src/hle/gx

output:
  root: generated
  functions: functions
  runtime_config: RuntimeConfig.h
  data_initializer: data_sections_init.cpp
  base_manifest: ../build/base/mkwii_base_manifest.json

# Code.pul carries a separate chunk for this region. The regional link base determines
# the branch bytes checked at startup; execution is remapped to module_guest_base.
profiles:
  retro-rewind:
    enabled: true
    requires_game_id: RMCJ01
    requires_dol_sha256: 1b9621ef7c5d97dada103e50e5389730e67f3c2545dda592edd4b5843655af91
    code_pul: PulsarPacks/completed/RetroRewind/RetroRewind6/Binaries/Code.pul
    mod_root: PulsarPacks/completed/RetroRewind/RetroRewind6
    region: J
    module_guest_base: 0x81800000
    module_link_base: 0x80398C60
    output: build/mods/retro_rewind_full_cpp
    enable_retro_wfc: true
    retro_wfc_payload: https://rwfc.net/api/wfc/payload?g=RMCJD00
    retro_wfc_legacy_bootstrap_hook: 0x800ED608
    riivolution:
      xml: xml/RetroRewind6.xml
      options:
        - section: Retro Rewind
          option: Pack
          choice: 1
