name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recompilation:
    name: Recompilation test
    uses: ./.github/workflows/recomp-test.yml

  translator:
    name: Translator (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('translator/Translator.sln', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', 'global.json', 'NuGet.config', 'nuget.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore translator/Translator.sln

      - name: Build
        run: dotnet build translator/Translator.sln -c Release --no-restore

      - name: Test
        run: dotnet test translator/Translator.sln -c Release --no-build --verbosity normal

  platform_tests:
    name: Host platform (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test Linux prebuilt package selection
        if: runner.os == 'Linux'
        run: bash Launcher/Test-AuroraPrebuilt.sh

      - name: Configure without graphics dependencies or game assets
        run: >-
          cmake -S runtime -B build-platform -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DMKW_BUILD_PRODUCTS=OFF -DMKW_PLATFORM_TESTS_ONLY=ON

      - name: Build and run host-platform tests
        run: |
          cmake --build build-platform --parallel 3
          ctest --test-dir build-platform --output-on-failure

  linux_xwiimote:
    name: Linux native Wii Remote (no hardware or game assets)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Linux runtime and optional controller headers
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config libxwiimote-dev \
            libasound2-dev libpulse-dev libx11-dev libxext-dev libxrandr-dev \
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libusb-1.0-0-dev libudev-dev

      - name: Configure source runtime and controller regressions
        run: >-
          cmake -S runtime -B build-xwiimote -G Ninja
          -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DMKW_BUILD_PRODUCTS=OFF -DMKW_ENABLE_XWIIMOTE=ON
          -DMKW_BUILD_WIIMOTE_RUNTIME_PROBE=ON
          -DMKW_NATIVE_PREBUILT_EXPORT_DIR=build-xwiimote-export

      - name: Build and test without accessing Bluetooth
        run: |
          cmake --build build-xwiimote --parallel 3 --target mkw_runtime mkw_wiimote_runtime_probe mkw_wiimote_runtime_probe_sdl mkw_wiimote_native_protocol_tests mkw_wiimote_xwiimote_tests mkw_wiimote_native_manager_tests mkw_bluetooth_controller_tests
          ctest --test-dir build-xwiimote -R 'wiimote|bluetooth_controller' --output-on-failure

  macos_substrate:
    name: macOS arm64 (configure + substrate tests)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: recursive

      - name: Test macOS app dependency packaging
        shell: bash
        run: bash Launcher/macos/test-publish-app.command

      - name: Configure native runtime
        shell: bash
        run: |
          test "$(uname -m)" = arm64
          cmake -S runtime -B build-macos -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DMKW_BUILD_PRODUCTS=OFF
          grep -qx 'CMAKE_OSX_DEPLOYMENT_TARGET:STRING=12.0' \
            build-macos/CMakeCache.txt

      - name: Build macOS portability targets
        shell: bash
        run: |
          cmake --build build-macos --target \
            mkw_ppc_cr_logical_tests \
            mkw_platform_paths_tests \
            mkw_runtime_config_tests \
            mkw_memory_access_tests \
            mkw_nand_save_tests \
            mkw_nand_guest_path_tests \
            mkw_host_file_tests \
            mkw_system_bridge_tests \
            mkw_u8_archive_tests \
            mkw_runtime_config_io_tests \
            mkw_pad_trigger_tests \
            mkw_fiber_manager_tests \
            mkw_audio_backend_ownership_tests \
            mkw_network_receive_tests \
            mkw_nand_settings_tests \
            mkw_sc_serial_tests \
            mkw_input_expr_tests \
            mkw_motion_trick_tests \
            mkw_bluetooth_controller_tests \
            mkw_macos_native_compile \
            mkw_macos_context_abi_tests \
            mkw_macos_host_context_tests \
            mkw_macos_guest_flat_memory_tests \
            mkw_macos_external_audio_tests \
            mkw_ax_mix_kernels_tests

      - name: Test execution substrate
        shell: bash
        run: ctest --test-dir build-macos --output-on-failure

      - name: Check ARM audio kernels with sanitizers
        shell: bash
        run: |
          clang++ -std=c++17 -O2 -fno-fast-math \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -DMKW_AX_MIX_REQUIRE_NEON=1 \
            -Iruntime/include -Iruntime/src/hle/audio \
            runtime/tests/ax_mix_kernels_tests.cpp -o build-macos/ax-mix-sanitized
          build-macos/ax-mix-sanitized
          build-macos/mkw_ax_mix_kernels_tests --benchmark 20000
